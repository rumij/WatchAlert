name: Publish GHCR database images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ghcr-dependencies.yml'
      - 'deploy/ghcr/images/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-dependencies
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'rumij/WatchAlert' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mysql
            version: '8.0.46'
            alias: '8.0'
            source: docker.io/library/mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
          - name: redis
            version: '7.4.11-alpine'
            alias: '7.4-alpine'
            source: docker.io/library/redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish pinned official image with repository metadata
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: deploy/ghcr/images
          file: deploy/ghcr/images/Dockerfile.mirror
          platforms: linux/amd64
          push: true
          build-args: BASE_IMAGE=${{ matrix.source }}
          tags: |
            ghcr.io/rumij/watchalert-${{ matrix.name }}:${{ matrix.version }}
            ghcr.io/rumij/watchalert-${{ matrix.name }}:${{ matrix.alias }}
          labels: |
            org.opencontainers.image.source=https://github.com/rumij/WatchAlert
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.base.name=${{ matrix.source }}
            org.opencontainers.image.description=Official ${{ matrix.name }} distribution copy; unchanged filesystem layers, repository metadata added.
