name: Publish paired GHCR images

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'deploy/ghcr/**'
      - '.github/workflows/ghcr-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rumij/WatchAlert' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names and version
        id: meta
        run: |
          echo "backend=ghcr.io/rumij/watchalert-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/rumij/watchalert-frontend" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/rumij/WatchAlert
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/rumij/WatchAlert
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build and push frontend for legacy hosts
        id: compat
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          file: ./web/Dockerfile.compat
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}-compat
          build-args: |
            ASSET_IMAGE=${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}
            RUNTIME_IMAGE=docker.io/library/nginx@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
          labels: |
            org.opencontainers.image.source=https://github.com/rumij/WatchAlert
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Legacy-host compatibility frontend with nginx 1.27.5 runtime; prefer the standard image on modern hosts.
      - name: Promote successful builds
        env:
          BACKEND: ${{ steps.meta.outputs.backend }}
          FRONTEND: ${{ steps.meta.outputs.frontend }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          COMPAT_DIGEST: ${{ steps.compat.outputs.digest }}
          VERSION_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx imagetools create --tag "$BACKEND:latest" "$BACKEND@$BACKEND_DIGEST"
          docker buildx imagetools create --tag "$FRONTEND:latest" "$FRONTEND@$FRONTEND_DIGEST"
          docker buildx imagetools create --tag "$FRONTEND:compat" "$FRONTEND@$COMPAT_DIGEST"
          {
            echo '## Paired images (linux/amd64)'
            echo "- $BACKEND:$VERSION_TAG"
            echo "- $FRONTEND:$VERSION_TAG"
            echo "- $FRONTEND:$VERSION_TAG-compat (legacy hosts)"
            echo ''
            echo 'Pin the same sha tag for both services. latest tags update separately.'
          } >> "$GITHUB_STEP_SUMMARY"
